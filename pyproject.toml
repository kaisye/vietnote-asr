[project]
name = "vietnote-asr"
version = "1.0.0"
description = "Streaming Vietnamese–English (code-switching) speech recognition: text tools (ITN, hotwords) and demo"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
asr = ["sherpa-onnx>=1.12", "numpy", "soundfile"]
punct = ["onnxruntime>=1.18", "transformers>=4.40", "sentencepiece", "tokenizers"]
demo = ["aiohttp>=3.9", "sherpa-onnx>=1.12", "numpy", "soundfile", "sentencepiece", "onnxruntime>=1.18", "transformers>=4.40", "tokenizers"]
dev = ["pytest>=8"]

[project.urls]
Demo = "https://asr.vietnote.vn"
Models = "https://huggingface.co/kaisye/vietnote-asr"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vnasr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
